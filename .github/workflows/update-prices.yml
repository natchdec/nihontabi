name: update-prices-and-deploy
on:
  schedule:
    - cron: "0 1 * * *"   # 01:00 UTC = 08:00 Thailand, daily
  workflow_dispatch:
    inputs:
      provider:
        description: "travelpayouts (real) or mock (pipeline test, fake prices)"
        default: "travelpayouts"
      target:
        description: "live (nihontabi.web.app) or preview (temporary test channel, never live)"
        default: "live"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROVIDER: ${{ github.event.inputs.provider || 'travelpayouts' }}
      TARGET: ${{ github.event.inputs.target || 'live' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Fetch prices
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: node scripts/update_prices.mjs
      - name: Rebuild guide pages (price tables) and sitemap
        run: python3 scripts/build_pages.py
      - name: Safety check (never publish mock data live)
        run: |
          if grep -q '"mock": true' data/px_summary.json && [ "$TARGET" != "preview" ]; then echo "mock data must not go live"; exit 1; fi
      - name: Commit changed price file (live runs only)
        if: env.TARGET == 'live'
        run: |
          git config user.name "price-bot"; git config user.email "price-bot@users.noreply.github.com"
          git add data/px_summary.json data/px_history.json data/px_months.json guide sitemap.xml llms.txt && (git diff --cached --quiet || git commit -m "update prices $(date -u +%F)") && git push || true
      - name: Remove old hosting versions before deploying
        if: env.TARGET == 'live'
        continue-on-error: true
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/cleanup_versions.mjs
      - name: Deploy to Firebase Hosting
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "no FIREBASE_SERVICE_ACCOUNT secret, skip deploy"; exit 0; fi
          echo "$SA" > "$RUNNER_TEMP/sa.json"; export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          if [ "$TARGET" = "preview" ]; then
            npx --yes firebase-tools hosting:channel:deploy pxtest --only nihontabi --expires 1d --project nihontabi-63523
          else
            npx --yes firebase-tools deploy --only hosting --project nihontabi-63523
          fi
          rm -f "$RUNNER_TEMP/sa.json"
      - name: Remove old hosting versions (keeps storage under the free quota)
        if: env.TARGET == 'live'
        continue-on-error: true
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/cleanup_versions.mjs
